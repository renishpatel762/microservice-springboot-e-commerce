spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://order-db:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://product-service:8081}
  timeout:
    connect-ms: 5000
    read-ms: 5000

logging:
  level:
    root: INFO
    com.ecommerce.order: INFO
