spring:
  datasource:
    url: jdbc:h2:mem:order_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

product-service:
  base-url: http://localhost:8081
  timeout:
    connect-ms: 2000
    read-ms: 2000

logging:
  level:
    root: WARN
    com.ecommerce.order: INFO
